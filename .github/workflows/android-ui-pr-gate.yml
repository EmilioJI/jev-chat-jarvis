name: Android UI PR Gate

on:
  pull_request:
    branches:
      - feature/hardening-v1
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preinstalled toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          command -v gradle
          gradle --version
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          ls "$ANDROID_HOME/build-tools" | grep -E '^35(\.|$)' | head -1

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.jev.probe.guofeng'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'Jev聊天助手·国风验收'"

      - name: Upload acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-guofeng-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
